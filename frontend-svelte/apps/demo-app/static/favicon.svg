<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Friendly Brown French Bulldog (No Collar) -->

  <!-- Head Base -->
  <path
    d="M12 20 Q8 8 16 6 Q20 4 22 10 L24 16 L32 15 L40 16 L42 10 Q44 4 48 6 Q56 8 52 20 Q54 28 50 36 Q48 42 42 44 L40 46 L32 47 L24 46 L22 44 Q16 42 14 36 Q10 28 12 20 Z"
    fill="#8D6E63" stroke="#5D4037" stroke-width="1.5" />

  <!-- Inner Ears (Pinkish) -->
  <path d="M16 20 Q14 12 18 10 Q20 9 21 12 Z" fill="#D7CCC8" opacity="0.8" />
  <path d="M48 20 Q50 12 46 10 Q44 9 43 12 Z" fill="#D7CCC8" opacity="0.8" />

  <!-- Face Markings (Lighter Brown/Cream on muzzle) -->
  <path d="M22 30 Q32 25 42 30 Q44 38 40 44 Q32 48 24 44 Q20 38 22 30 Z" fill="#D7CCC8" />

  <!-- Eyes -->
  <ellipse cx="24" cy="28" rx="3.5" ry="4" fill="black" />
  <circle cx="25" cy="26" r="1.5" fill="white" opacity="0.7" /> <!-- Shine -->

  <ellipse cx="40" cy="28" rx="3.5" ry="4" fill="black" />
  <circle cx="39" cy="26" r="1.5" fill="white" opacity="0.7" /> <!-- Shine -->

  <!-- Nose (Black, Flat) -->
  <path d="M28 34 Q32 33 36 34 L35 37 Q32 39 29 37 Z" fill="#3E2723" />

  <!-- Mouth -->
  <path d="M32 37 L32 40 M28 38 Q32 42 36 38" stroke="#3E2723" stroke-width="1.5" fill="none"
    stroke-linecap="round" />

  <!-- Text Below Head -->
  <text x="32" y="60" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-weight="900" font-size="6" text-anchor="middle" fill="#5D4037">AT SOFT</text>
</svg>