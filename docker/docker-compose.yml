version: '3.8'

services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - atlassian-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on

  confluence:
    image: atlassian/confluence:${CONFLUENCE_VERSION}
    container_name: confluence
    ports:
      - "8090:8090"
    environment:
      - ATL_JDBC_URL=jdbc:postgresql://postgres:5432/confluencedb
      - ATL_JDBC_USER=${POSTGRES_USER}
      - ATL_JDBC_PASSWORD=${POSTGRES_PASSWORD}
      - ATL_DB_TYPE=${CONFLUENCE_DB_TYPE}
      - JVM_SUPPORT_RECOMMENDED_ARGS=${JVM_SUPPORT_ARGS}
      - JVM_MINIMUM_MEMORY=${JVM_MIN_MEMORY}
      - JVM_MAXIMUM_MEMORY=${JVM_MAX_MEMORY}
    volumes:
      - ./data/confluence-home:/var/atlassian/application-data/confluence
    networks:
      - atlassian-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: on

  jira:
    image: atlassian/jira-software:${JIRA_VERSION}
    container_name: jira
    ports:
      - "8080:8080"
    environment:
      - ATL_JDBC_URL=jdbc:postgresql://postgres:5432/jiradb
      - ATL_JDBC_USER=${POSTGRES_USER}
      - ATL_JDBC_PASSWORD=${POSTGRES_PASSWORD}
      - ATL_DB_DRIVER=org.postgresql.Driver
      - ATL_DB_TYPE=${ATL_DB_TYPE}
      - JVM_SUPPORT_RECOMMENDED_ARGS=${JVM_SUPPORT_ARGS}
      - JVM_MINIMUM_MEMORY=${JVM_MIN_MEMORY}
      - JVM_MAXIMUM_MEMORY=${JVM_MAX_MEMORY}
    volumes:
      - ./data/jira-home:/var/atlassian/application-data/jira
    networks:
      - atlassian-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: on

networks:
  atlassian-net:
    driver: bridge
