<!doctype html>
<html lang="en" data-color-mode="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.png" />
		<meta name="viewport" content="width=device-width" />
		<meta name="theme-color" content="#ffffff" />

		<!-- Atlassian AUI from cdnjs.com -->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/aui/10.0.3/aui/aui-prototyping.min.css"
			integrity="sha512-Vd8tn75zczmrBNNEbfr4/szkNfpRqwW7MFT4IIC6QjzawHRGwg4+wFHMA7zyjuMQ8SMBo1kYDalrjXFGdj5cSQ=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		/>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/aui/10.0.3/aui/aui-prototyping.min.js"
			integrity="sha512-oVUMX19aYm4OgaD4ZcXZq29ZI4oM1O6KXd80zGcyQNpvAaH9Z/cs6uk+azFm7l/TYP2+XPYHRq4xxx/XY5uB0Q=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		></script>

		%sveltekit.head%

		<!-- Confluence integration -->
		<meta name="decorator" content="atl.general" />
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-white dark:bg-[#0d1117]">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
